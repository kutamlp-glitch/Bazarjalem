let stars=0;const $=id=>document.getElementById(id);

const addStar=n=>{stars+=n;$('stars').textContent=stars};
function speak(t){ // Text-to-speech in Urdu
  if(!('speechSynthesis' in window)){alert('Speech not supported in this browser');return}
  speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(strip(t));
  const vs=speechSynthesis.getVoices();const v=vs.find(x=>x.lang.startsWith('ur'));
  if(v){u.voice=v;u.lang=v.lang}else u.lang='ur-PK';u.rate=.8;speechSynthesis.speak(u);
}
speechSynthesis&&speechSynthesis.getVoices();
function sent(t){ // make every word clickable
  const toks=t.split(' ');let h='';
  for(let i=0;i<toks.length;i++){
    let two=strip(toks[i]+' '+(toks[i+1]||''));
    if(D[two]){h+=`<span class="w" data-k="${two}">${toks[i]} ${toks[i+1]}</span> `;i++}
    else h+=`<span class="w" data-k="${strip(toks[i])}">${toks[i]}</span> `;
  }return h;
}
document.addEventListener('click',e=>{
  const w=e.target.closest('.w');if(!w)return;
  const k=w.dataset.k;speak(k);const d=D[k];
  $('pw').textContent=k;$('pt').textContent=d?d[0]:'';$('pm').textContent=d?d[1]:'(tap 🔊 to hear)';$('pe').textContent=d?d[2]:'';
  pop.classList.remove('hidden');
});
function confetti(){
  for(let i=0;i<40;i++){const c=document.createElement('div');c.className='conf';
    c.textContent=['🎉','⭐','🎈','🍎','✨'][i%5];c.style.left=Math.random()*100+'vw';c.style.animationDelay=Math.random()+'s';
    document.body.appendChild(c);setTimeout(()=>c.remove(),4500)}
}

};

  <div id="pool" class="flex flex-wrap gap-2 justify-center mb-3 card"></div>
  <div class="grid md:grid-cols-3 gap-2">${Object.keys(SHOPS).map(k=>`<div><div class="font-bold text-center bg-yellow-300 rounded-t-xl p-1">${SHOPS[k]}</div><div class="shop flex flex-wrap gap-1 bg-white" data-s="${k}"></div></div>`).join('')}</div>`;

  shuffle(SORT).forEach((s,i)=>{
    const b=document.createElement('div');b.className='chip text-center';b.draggable=true;b.id='it'+i;b.dataset.s=s[2];

    b.ondragstart=e=>e.dataTransfer.setData('t',b.id);
    b.onclick=()=>{document.querySelectorAll('.chip').forEach(c=>c.classList.remove('sel'));sel=b;b.classList.add('sel')};
    pool.appendChild(b)});
  const place=(b,shop)=>{
    if(b.dataset.s===shop.dataset.s){shop.appendChild(b);b.draggable=false;b.classList.add('ok');b.classList.remove('sel');sel=null;addStar(1);
      if(++done===SORT.length){confetti();alert('🎉 Shabash! Well done! ശബാഷ്!')}}
    else{b.classList.add('bad');setTimeout(()=>b.classList.remove('bad'),600)}};
  document.querySelectorAll('.shop').forEach(s=>{
    s.ondragover=e=>e.preventDefault();
    s.ondrop=e=>{e.preventDefault();place($(e.dataTransfer.getData('t')),s)};
    s.onclick=()=>{if(sel)place(sel,s)}});
};

/* ---------- TOY SHOP FILL-IN ---------- */
V.toy=el=>{
  el.innerHTML=`<div class="card mb-2 text-center">🧸 <b>کھلونے کی دکان</b> – Price list: گیند ⚽ 15 · ٹوپی 🧢 10 · گڑیا 🪆 20 rupees<br>
  <span class="text-sm">Complete the talk between Farhan and the shopkeeper. / സംഭാഷണം പൂർത്തിയാക്കൂ.</span></div>
  <div class="card mb-2"><div class="ur text-xl"><b>دکان دار:</b> کیا چاہیے بیٹا؟</div><div class="ur text-xl"><b>فرحان:</b> گڑیا کا کیا دام ہے؟</div></div>`+
  TOY.map((t,i)=>`<div class="card mb-2"><div class="ur text-xl"><b>${t[0]}:</b> <span id="bl${i}">${t[1]}</span></div>
  <div class="flex flex-wrap gap-2 justify-center ur">${t[2].map((o,j)=>`<button class="chip text-lg" onclick="toyPick(${i},${j},this)">${o}</button>`).join('')}</div></div>`).join('')+
  `<div id="toyOk" class="text-center text-xl font-bold text-green-600"></div>`;
};
let toyDone={};
function toyPick(i,j,b){
  const t=TOY[i];
  if(j===t[3]){b.classList.add('ok');$('bl'+i).innerHTML=`<span class="w" data-k="${t[2][j]}">${t[2][j]}</span>`;
    speak(t[1].replace('____',t[2][j]));if(!toyDone[i]){toyDone[i]=1;addStar(2)}
    if(Object.keys(toyDone).length===TOY.length){confetti();$('toyOk').textContent='🎉 Perfect! 10 + 20 = 30 روپے'}}
  else{b.classList.add('bad')}
}

/* ---------- VEHICLES ---------- */
V.veh=el=>{
  el.innerHTML=`<p class="text-center font-bold mb-2">Read the clue. Which vehicle am I? / ഞാൻ ഏത് വാഹനം?</p>`+
  VEH.map((v,i)=>`<div class="card mb-3"><div class="ur text-xl">${sent(v[0])}</div>
  <div class="flex flex-wrap gap-2 justify-center mt-1 ur">${shuffle(VEH).map(o=>`<button class="chip text-xl" onclick="vehPick(${i},'${o[2]}',this)">${o[1]} ${o[2]}</button>`).join('')}</div>
  <div id="vr${i}" class="text-center font-bold text-purple-700"></div></div>`).join('');
  window.vehDone=0;
};
function vehPick(i,n,b){
  if(VEH[i][2]===n){b.classList.add('ok');$('vr'+i).textContent='✅ '+VEH[i][3];speak(VEH[i][0]);addStar(2);
    if(++vehDone===VEH.length)confetti()}
  else{b.classList.add('bad');speak('نہیں')}
}

/* ---------- SENTENCE BUILDER ---------- */
V.write=el=>{
  el.innerHTML=`<div class="card mb-2 text-center"><img alt="" class="hidden"><span class="text-5xl">🏪🚗🛵🚌</span><br>Look at the market picture (p. 89). Tap words to build sentences. / വാക്കുകൾ തൊട്ട് വാചകം ഉണ്ടാക്കൂ.<br>
  <span class="ur">جیسے: یہ بازار ہے۔</span></div>
  <div id="out" class="card ur text-2xl min-h-[70px] mb-2"></div>
  <div class="flex gap-2 justify-center mb-2"><button class="btn" onclick="speak(out.textContent)">🔊 Read</button>
  <button class="btn !bg-slate-400" onclick="out.textContent=''">🗑️ Clear</button><button class="btn !bg-orange-500" onclick="saveS()">⭐ Save</button></div>
  <div class="flex flex-wrap gap-2 justify-center ur">${BUILD.map(w=>`<button class="chip text-xl" onclick="out.textContent+=this.textContent+' '">${w}</button>`).join('')}</div>
  <div id="saved" class="ur mt-3 text-xl"></div>`;
};
function saveS(){const t=$('out').textContent.trim();if(!t)return;$('saved').innerHTML+=`<div class="card mb-1">${sent(t)}</div>`;$('out').textContent='';addStar(1)}

/* ---------- QUIZ ---------- */
V.quiz=el=>{
  let q=0,sc=0;const qs=QUIZ.map(x=>({p:x[0],o:shuffle(x[1].map((t,i)=>[t,i===x[2]]))}));
  const show=()=>{
    if(q>=qs.length){const b=sc>=6?'🥇 Gold Shopper':sc>=4?'🥈 Silver Shopper':'🥉 Bronze Shopper';
      if(sc>=4)confetti();addStar(sc*2);
      el.innerHTML=`<div class="card text-center"><div class="text-7xl">🏆</div><h2 class="text-3xl font-bold">${sc} / ${qs.length}</h2><div class="text-2xl">${b}</div>
      <button class="btn mt-3" onclick="go('quiz')">Play again</button></div>`;return}
    const c=qs[q];
    el.innerHTML=`<div class="card"><div class="text-sm">Question ${q+1}/${qs.length}</div><div class="ur text-2xl">${c.p}</div>
    <div class="grid gap-2 mt-2">${c.o.map((o,i)=>`<button class="chip text-xl ur" data-i="${i}">${o[0]}</button>`).join('')}</div><div id="fb" class="text-xl font-bold mt-2"></div></div>`;
    el.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{
      const r=c.o[b.dataset.i][1];b.classList.add(r?'ok':'bad');
      $('fb').textContent=r?'🎉 Shabash!':'😅 Try next time!';if(r)sc++;
      el.querySelectorAll('[data-i]').forEach(x=>x.onclick=null);setTimeout(()=>{q++;show()},1100)});
  };show();
};

/* ---------- TRACING CANVAS ---------- */
V.trace=el=>{
  el.innerHTML=`<div class="card text-center"><p class="font-bold">Trace the word with your finger or mouse. / വിരൽ കൊണ്ട് എഴുതൂ.</p>
  <div class="flex flex-wrap gap-2 justify-center my-2 ur">${TRACE.map(w=>`<button class="chip text-xl" data-w="${w}">${w}</button>`).join('')}</div>
  <canvas id="cv" width="560" height="260"></canvas><div class="mt-2"><button class="btn" id="hear">🔊 Hear</button> <button class="btn !bg-slate-400" id="clr">Clear</button></div></div>`;
  const cv=$('cv'),x=cv.getContext('2d');let word=TRACE[0],draw=false;
  const bg=()=>{x.clearRect(0,0,560,260);x.fillStyle='#d1d5db';x.font='130px "Noto Nastaliq Urdu",serif';x.textAlign='center';x.textBaseline='middle';x.fillText(word,280,140)};
  const pos=e=>{const r=cv.getBoundingClientRect(),p=e.touches?e.touches[0]:e;return[(p.clientX-r.left)*560/r.width,(p.clientY-r.top)*260/r.height]};
  const st=e=>{e.preventDefault();draw=true;const[a,b]=pos(e);x.beginPath();x.moveTo(a,b)};
  const mv=e=>{if(!draw)return;e.preventDefault();const[a,b]=pos(e);x.strokeStyle='#ea580c';x.lineWidth=7;x.lineCap='round';x.lineTo(a,b);x.stroke()};
  const en=()=>{if(draw){draw=false;addStar(0)}};
  ['mousedown','touchstart'].forEach(n=>cv.addEventListener(n,st));
  ['mousemove','touchmove'].forEach(n=>cv.addEventListener(n,mv));
  ['mouseup','mouseleave','touchend'].forEach(n=>cv.addEventListener(n,en));
  el.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{word=b.dataset.w;bg();speak(word)});
  $('clr').onclick=bg;$('hear').onclick=()=>speak(word);
  (document.fonts?document.fonts.ready:Promise.resolve()).then(bg);
};

go('read');
</script>
</body>
</html>
